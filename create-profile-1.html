<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="bg-surface border-b border-surface-variant w-full shadow-sm sticky top-0 z-50">
<div class="flex justify-between items-center px-margin-desktop h-20 w-full max-w-max-width mx-auto">
<div class="text-headline-md font-headline-md text-primary font-bold">Roommate NG</div>
<nav class="hidden md:flex gap-md items-center">
<a class="text-on-surface-variant font-button hover:text-secondary transition-colors duration-200 scale-95 active:opacity-80 transition-transform" href="#">Back to Home</a>
</nav>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-max-width mx-auto px-margin-mobile md:px-margin-desktop py-lg">
<!-- Progress Bar -->
<div class="mb-lg">
<div class="flex justify-between items-center mb-xs">
<span class="font-label-bold text-label-bold text-primary">Step 1 of 3</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">33% complete</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-2">
<div class="bg-secondary-container h-2 rounded-full" style="width: 33%"></div>
</div>
</div>
<!-- Headers -->
<div class="mb-lg text-center md:text-left">
<h1 class="font-headline-lg text-headline-lg md:font-headline-xl md:text-headline-xl text-primary mb-xs">Tell us about yourself</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">We use this to build your basic identity on the platform.</p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-xl border border-surface-variant shadow-[0_4px_12px_rgba(30,41,59,0.05)] p-md md:p-lg w-full max-w-2xl mx-auto md:mx-0">
<form action="#" class="space-y-md" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-bold text-label-bold text-primary mb-xs" for="fullName">Full Name</label>
<input class="w-full rounded-full border-outline-variant px-sm py-3 font-body-md text-body-md focus:ring-2 focus:ring-secondary-container focus:border-secondary-container bg-surface-container-low" id="fullName" name="fullName" placeholder="e.g. Jane Doe" type="text"/>
</div>
<!-- Email Address -->
<div>
<label class="block font-label-bold text-label-bold text-primary mb-xs" for="email">Email Address</label>
<input class="w-full rounded-full border-outline-variant px-sm py-3 font-body-md text-body-md focus:ring-2 focus:ring-secondary-container focus:border-secondary-container bg-surface-container-low" id="email" name="email" placeholder="jane@example.com" type="email"/>
</div>
<!-- WhatsApp Number -->
<div>
<label class="block font-label-bold text-label-bold text-primary mb-xs" for="whatsapp">WhatsApp Number</label>
<div class="flex">
<select class="rounded-l-full border-outline-variant border-r-0 px-sm py-3 font-body-md text-body-md bg-surface-container-low focus:ring-2 focus:ring-secondary-container focus:border-secondary-container">
<option>+234</option>
<option>+1</option>
<option>+44</option>
</select>
<input class="w-full rounded-r-full border-outline-variant px-sm py-3 font-body-md text-body-md focus:ring-2 focus:ring-secondary-container focus:border-secondary-container bg-surface-container-low" id="whatsapp" name="whatsapp" placeholder="801 234 5678" type="tel"/>
</div>
</div>
<!-- Gender -->
<div>
<label class="block font-label-bold text-label-bold text-primary mb-xs">Gender</label>
<div class="flex space-x-2">
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="gender" type="radio" value="male"/>
<div class="text-center rounded-full border border-outline-variant py-3 font-body-md text-body-md peer-checked:bg-tertiary-fixed peer-checked:text-on-tertiary-fixed peer-checked:border-tertiary-fixed transition-colors bg-surface-container-low hover:bg-surface-variant">Male</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="gender" type="radio" value="female"/>
<div class="text-center rounded-full border border-outline-variant py-3 font-body-md text-body-md peer-checked:bg-tertiary-fixed peer-checked:text-on-tertiary-fixed peer-checked:border-tertiary-fixed transition-colors bg-surface-container-low hover:bg-surface-variant">Female</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="gender" type="radio" value="other"/>
<div class="text-center rounded-full border border-outline-variant py-3 font-body-md text-body-md peer-checked:bg-tertiary-fixed peer-checked:text-on-tertiary-fixed peer-checked:border-tertiary-fixed transition-colors bg-surface-container-low hover:bg-surface-variant">Other</div>
</label>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Age Range -->
<div>
<label class="block font-label-bold text-label-bold text-primary mb-xs" for="age">Age Range</label>
<select class="w-full rounded-full border-outline-variant px-sm py-3 font-body-md text-body-md bg-surface-container-low focus:ring-2 focus:ring-secondary-container focus:border-secondary-container" id="age" name="age">
<option>18 - 24</option>
<option>25 - 34</option>
<option>35 - 44</option>
<option>45+</option>
</select>
</div>
<!-- Religion -->
<div>
<label class="block font-label-bold text-label-bold text-primary mb-xs" for="religion">Religion</label>
<select class="w-full rounded-full border-outline-variant px-sm py-3 font-body-md text-body-md bg-surface-container-low focus:ring-2 focus:ring-secondary-container focus:border-secondary-container" id="religion" name="religion">
<option>Prefer not to say</option>
<option>Christianity</option>
<option>Islam</option>
<option>Other</option>
</select>
</div>
</div>
<!-- Marital Status -->
<div>
<label class="block font-label-bold text-label-bold text-primary mb-xs" for="maritalStatus">Marital Status</label>
<select class="w-full rounded-full border-outline-variant px-sm py-3 font-body-md text-body-md bg-surface-container-low focus:ring-2 focus:ring-secondary-container focus:border-secondary-container" id="maritalStatus" name="maritalStatus">
<option>Single</option>
<option>Married</option>
<option>Divorced</option>
<option>Widowed</option>
</select>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full flex justify-center items-center rounded-full bg-secondary-container text-on-secondary-container py-4 font-button text-button hover:bg-secondary-fixed transition-colors duration-200" type="submit">
                        Continue to Housing Needs
                        <span class="material-symbols-outlined ml-2" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</form>

<a class="text-on-surface-variant font-body-sm hover:text-primary transition-colors opacity-90 hover:opacity-100" href="#">Security Standards</a>
<a class="text-on-surface-variant font-body-sm hover:text-primary transition-colors opacity-90 hover:opacity-100" href="#">Help Center</a>
</nav>
